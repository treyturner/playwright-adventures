[project]
name = "playwright-adventures-py"
version = "0.1.0"
description = "Playwright + MCP sidecar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0",
  "playwright>=1.62.0",
  "pydantic>=2.13.4"
]

[dependency-groups]
dev = [
  "mypy>=2.3.0",
  "pytest>=9.1.1",
  "pytest-playwright-asyncio>=0.9.0",
  "ruff>=0.16.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["playwright_adventures*"]
