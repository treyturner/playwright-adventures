version: 1
journeys:
  - id: login-and-view-dashboard
    name: Login and View Dashboard
    description: Basic happy-path login and dashboard visibility journey.
    successMessage: Dashboard rendered
    preconditions:
      - User exists in fixture data with valid credentials.
      - Base application is reachable and renders the login form.
    steps:
      - action: navigate
        path: /
      - action: click
        selector:
          by: role
          role: link
          name:
            pattern: sign in|log in
            ignoreCase: true
      - action: fill
        selector:
          by: label
          name:
            pattern: email
            ignoreCase: true
        value: user.email
      - action: fill
        selector:
          by: label
          name:
            pattern: password
            ignoreCase: true
        value: user.password
      - action: click
        selector:
          by: role
          role: button
          name:
            pattern: sign in|log in
            ignoreCase: true
      - action: assert-visible
        selector:
          by: role
          role: heading
          level: 1
          name:
            pattern: dashboard
            ignoreCase: true
      - action: assert-visible
        selector:
          by: testId
          value: account-summary

  - id: view-account-details
    name: View Account Details
    description: Navigate to an account details page from dashboard.
    successMessage: Account details rendered
    extends: login-and-view-dashboard
    preconditions:
      - Logged in user with at least one account.
      - Dashboard lists accounts with a stable test id.
    steps:
      - action: click
        selector:
          by: testId
          value: account-list-item
          first: true
      - action: assert-visible
        selector:
          by: role
          role: heading
          level: 1
          name:
            pattern: account details
            ignoreCase: true
      - action: assert-visible
        selector:
          by: testId
          value: transaction-table
