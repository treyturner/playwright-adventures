name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL of an application that supports the smoke journeys
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test managed fixture app
        run: npm run test:fixture
      - name: Test MCP protocol
        run: npm run test:mcp
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test MCP browser security
        run: npm run test:mcp:browser
      - name: Test managed smoke journeys
        run: npm run test:smoke

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Build
        run: uv build
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src tests
      - name: Test MCP protocol
        run: uv run pytest tests/mcp
      - name: Install Chromium and system dependencies
        run: uv run playwright install --with-deps chromium
      - name: Test MCP browser security
        run: uv run pytest tests/integration
      - name: Test managed smoke journeys
        run: uv run pytest tests/smoke

  smoke:
    name: Live browser smoke tests
    if: ${{ inputs.base_url != '' || vars.BASE_URL != '' }}
    needs: [javascript, python]
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.5
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Install JavaScript dependencies
        run: npm ci
        working-directory: js
      - name: Install Python dependencies
        run: uv sync --locked
        working-directory: py
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: js
      - name: Install Python Playwright browser
        run: uv run playwright install chromium
        working-directory: py
      - name: Run JavaScript smoke tests
        run: npm run test:smoke
        working-directory: js
      - name: Run Python smoke tests
        run: uv run pytest tests/smoke
        working-directory: py
